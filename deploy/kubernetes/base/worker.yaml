apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      automountServiceAccountToken: false
      # Stop: the worker stops consuming, lets running jobs finish (Worker:ShutdownGraceSeconds, 20 s),
      # hands back the rest and goes offline. This must exceed that, plus time to record outcomes.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: worker }
      containers:
        - name: worker
          image: reeve-worker
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: reeve-config }
            - secretRef: { name: reeve-secrets }
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 2
            failureThreshold: 30
          # Live: its loops (consumer, heartbeat, recovery) are still completing passes, even failing
          # ones. Only a hung process fails this.
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Ready: registered and heartbeating to PostgreSQL. Gates rolling updates, so a new version
          # that can't work stops the rollout before old workers are replaced.
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
# CPU is a stand-in for load here. Kafka splits each topic into 6 partitions and a consumer group
# gives each partition to one worker, so more than 6 workers would sit idle. Scaling on consumer
# lag or queue depth (KEDA, or the reeve_queue_depth metric through an adapter) tracks the
# backlog directly.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: worker }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    # Each scale-in rebalances the consumer group and drains a worker: do it slowly.
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - { type: Pods, value: 1, periodSeconds: 60 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: worker }
