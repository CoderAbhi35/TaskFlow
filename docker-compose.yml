# The whole Reeve platform on one machine: infrastructure, observability and the application.
#
#   docker compose up -d --build --wait
#
# Dashboard: http://localhost:8080   Grafana: http://localhost:3000   Jaeger: http://localhost:16686
#
# PostgreSQL, Kafka, Redis and the OTLP endpoint are also published on localhost, so the services
# can instead run from an IDE: `docker compose stop ui api scheduler worker` first.
#
# Credentials and the signing key here are for local development only.

name: reeve

# Settings shared by the .NET services. Configuration keys use the standard double-underscore
# form of the appsettings.json sections.
x-dotnet-env: &dotnet-env
  ConnectionStrings__Reeve: Host=postgres;Port=5432;Database=reeve;Username=reeve;Password=reeve
  Kafka__BootstrapServers: kafka:29092
  Telemetry__OtlpEndpoint: http://otel-collector:4317

x-dotnet-app: &dotnet-app
  restart: unless-stopped
  depends_on: &dotnet-deps
    migrate:
      condition: service_completed_successfully
    otel-collector:
      condition: service_started

networks:
  default:
    name: reeve
    # A fixed range, so the API can trust X-Forwarded-For from the nginx proxy on it and nobody else.
    ipam:
      config:
        - subnet: 10.89.0.0/24

services:
  postgres:
    image: postgres:17
    container_name: reeve-postgres
    # Room for every service's connection pool (Database:MaxPoolSize): API 40, scheduler 10, and
    # Worker:Concurrency + 8 per worker. The default of 100 runs out at about five workers.
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: reeve
      POSTGRES_USER: reeve
      POSTGRES_PASSWORD: reeve
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reeve -d reeve"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.0.0
    container_name: reeve-kafka
    ports:
      - "9092:9092"
    environment:
      # Single-node KRaft (no ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners with different advertised addresses: containers connect to kafka:29092,
      # processes on the host to localhost:9092. A client uses the address the broker advertises,
      # so one listener can't serve both.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: reeve-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- observability ------------------------------------------------------------------------
  # Reeve processes push OTLP to the collector (localhost:4317). Traces go to Jaeger; metrics are
  # scraped by Prometheus; Grafana shows both.

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: reeve-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    container_name: reeve-jaeger
    ports:
      - "16686:16686" # UI

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: reeve-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      # Store a zero at each series' start time, so rate() also counts what happened before its first scrape.
      - --enable-feature=created-timestamp-zero-ingestion
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:13.2.2
    container_name: reeve-grafana
    environment:
      # Local development only: open the dashboards without signing in (read-only).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/reeve.json
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger

  # ---- application --------------------------------------------------------------------------
  # Images are built from deploy/docker. Only the dashboard is published; the API is reached
  # through it, on the same origin.

  migrate:
    # Applies pending EF Core migrations, then exits. The other services wait for it to succeed.
    image: reeve-migrate:local
    build: { context: ., dockerfile: deploy/docker/Dockerfile, target: migrate }
    environment:
      REEVE_CONNECTION_STRING: Host=postgres;Port=5432;Database=reeve;Username=reeve;Password=reeve
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *dotnet-app
    image: reeve-api:local
    build: { context: ., dockerfile: deploy/docker/Dockerfile, target: api }
    environment:
      <<: *dotnet-env
      # Development enables the built-in token issuer (sign in as viewer/operator/admin, password =
      # username); it refuses to start in any other environment.
      ASPNETCORE_ENVIRONMENT: Development
      Logging__Console__FormatterName: json
      Logging__Console__FormatterOptions__UseUtcTimestamp: "true"
      Logging__Console__FormatterOptions__TimestampFormat: "yyyy-MM-dd'T'HH:mm:ss.fff'Z'"
      Redis__ConnectionString: redis:6379
      ReverseProxy__TrustedNetworks__0: 10.89.0.0/24
    depends_on:
      <<: *dotnet-deps
      redis:
        condition: service_healthy

  scheduler:
    <<: *dotnet-app
    image: reeve-scheduler:local
    build: { context: ., dockerfile: deploy/docker/Dockerfile, target: scheduler }
    environment:
      <<: *dotnet-env
    depends_on:
      <<: *dotnet-deps
      kafka:
        condition: service_healthy

  worker:
    <<: *dotnet-app
    image: reeve-worker:local
    build: { context: ., dockerfile: deploy/docker/Dockerfile, target: worker }
    environment:
      <<: *dotnet-env
    # Two workers in one consumer group share the topic partitions.
    # Scale with: docker compose up -d --scale worker=4
    deploy:
      replicas: 2
    # Room to finish running jobs on shutdown (Worker:ShutdownGraceSeconds is 20).
    stop_grace_period: 30s
    depends_on:
      <<: *dotnet-deps
      kafka:
        condition: service_healthy

  ui:
    image: reeve-ui:local
    build: { context: ., dockerfile: deploy/docker/ui.Dockerfile }
    container_name: reeve-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Healthy only when the API answers through the proxy, so `up --wait` returns a usable system.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 24
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  kafka-data:
  prometheus-data:
  grafana-data:
